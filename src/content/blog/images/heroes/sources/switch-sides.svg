<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f6efe2"/>
  <!-- the overloaded side: everyone crowded around the ball, bottom left -->
  <g>
    <circle cx="188" cy="470" r="38" fill="#5f5546" opacity="0.16" transform="translate(7 7)"/>
    <circle cx="188" cy="470" r="38" fill="#b3a68d"/>
    <circle cx="300" cy="530" r="38" fill="#5f5546" opacity="0.16" transform="translate(7 7)"/>
    <circle cx="300" cy="530" r="38" fill="#b3a68d"/>
    <circle cx="318" cy="392" r="38" fill="#5f5546" opacity="0.16" transform="translate(7 7)"/>
    <circle cx="318" cy="392" r="38" fill="#b3a68d"/>
    <circle cx="432" cy="470" r="38" fill="#5f5546" opacity="0.16" transform="translate(7 7)"/>
    <circle cx="432" cy="470" r="38" fill="#b3a68d"/>
    <circle cx="196" cy="330" r="38" fill="#5f5546" opacity="0.16" transform="translate(7 7)"/>
    <circle cx="196" cy="330" r="38" fill="#b3a68d"/>
  </g>
  <!-- two green attackers holding the ball side -->
  <circle cx="252" cy="415" r="44" fill="#5f5546" opacity="0.16" transform="translate(8 8)"/>
  <circle cx="252" cy="415" r="44" fill="#006437"/>
  <circle cx="392" cy="545" r="40" fill="#5f5546" opacity="0.16" transform="translate(8 8)"/>
  <circle cx="392" cy="545" r="40" fill="#006437"/>
  <!-- the ball -->
  <circle cx="308" cy="452" r="24" fill="#5f5546" opacity="0.16" transform="translate(6 6)"/>
  <circle cx="308" cy="452" r="24" fill="#c2410c"/>
  <path d="M 284 452 H 332 M 308 428 V 476" stroke="#f6efe2" stroke-width="4" fill="none"/>
  <!-- the switch: one long diagonal across the whole frame -->
  <path d="M 350 400 Q 660 210 940 148" fill="none" stroke="#c2410c" opacity="0.20" stroke-width="32" stroke-linecap="round"/>
  <path d="M 350 400 Q 660 210 940 148" fill="none" stroke="#c2410c" stroke-width="13" stroke-linecap="round" stroke-dasharray="0.1 32"/>
  <polygon points="978,141 906,126 912,180" fill="#c2410c"/>
  <!-- the far side: one attacker, acres of room -->
  <circle cx="1042" cy="128" r="48" fill="#5f5546" opacity="0.16" transform="translate(8 8)"/>
  <circle cx="1042" cy="128" r="48" fill="#006437"/>
  <!-- the empty space they're standing in -->
  <circle cx="1042" cy="128" r="104" fill="none" stroke="#d97706" stroke-width="8" stroke-dasharray="0.1 22" stroke-linecap="round"/>
</svg>
